<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Admin</title>

    <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="./assets/css/index.css" />
  </head>
  <body>
    <nav
      class="navbar bg-body navbar-expand-lg position-sticky top-0 border-bottom"
      style="z-index: 1000"
    >
      <div
        class="container d-flex justify-content-between justify-content-lg-around"
      >
        <a href="#" class="navbar-brand">Store</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#sidebar"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <div
          id="sidebar"
          class="offcanvas-lg offcanvas-end col-2 position-fixed border-end p-0 d-flex flex-column"
          style="min-height: calc(100vh - 60px)"
          tabindex="-1"
          data-bs-backdrop="false"
        >
          <div class="offcanvas-header border-bottom d-lg-none">
            <h5 class="offcanvas-title">Menu</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="offcanvas"
              data-bs-target="#sidebar"
            ></button>
          </div>
          <input
            type="radio"
            class="btn-check"
            name="menu"
            id="optionDashboard"
            autocomplete="off"
            checked
          />
          <label
            class="btn radioBtn text-start w-100"
            for="optionDashboard"
            id="labelOptionDashboard"
          >
            <span class="bi bi-speedometer2 me-2"></span> Dashboard
          </label>
          <input
            type="radio"
            class="btn-check"
            name="menu"
            id="optionProducts"
            autocomplete="off"
          />
          <label
            class="btn radioBtn text-start w-100"
            for="optionProducts"
            id="labelOptionProducts"
          >
            <span class="bi bi-box me-2"></span> Products
          </label>
          <div class="form-check form-check-reverse form-switch mt-auto px-5">
            <label class="form-check-label" for="darkModeSwitch">
              Dark Mode
            </label>
            <input
              class="form-check-input"
              type="checkbox"
              role="switch"
              id="darkModeSwitch"
            />
          </div>
        </div>
        <main class="col-12 col-lg-10 offset-lg-2">
          <div class="container" id="dashboardPage">
            <div class="my-5 row gap-5 justify-content-center">
              <div class="col-12 col-lg-3 card border-0 shadow-sm p-0">
                <div class="card-body h1 d-flex justify-content-between">
                  <span class="bi bi-box-seam text-success"></span>
                </div>
                <div class="card-footer">Total Products</div>
              </div>
              <div class="col-12 col-lg-3 card border-0 shadow-sm p-0">
                <div class="card-body h1 d-flex justify-content-between">
                  <span class="bi bi-boxes text-success"></span>
                </div>
                <div class="card-footer">Total Quantity</div>
              </div>
              <div class="col-12 col-lg-3 card border-0 shadow-sm p-0">
                <div class="card-body h1 d-flex justify-content-between">
                  <span class="text-success">&#8377;</span>
                </div>
                <div class="card-footer">Inventory Value</div>
              </div>
            </div>
          </div>

          <div class="my-5 d-none" id="productsPage">
            <div
              class="d-flex flex-column flex-lg-row gap-2 justify-content-between"
            >
              <div class="d-flex flex-column flex-lg-row gap-2">
                <button
                  type="button"
                  class="btn btn-danger"
                  data-bs-toggle="modal"
                  data-bs-target="#delProdModal"
                >
                  Delete
                </button>
                <button
                  type="button"
                  class="btn btn-success"
                  data-bs-toggle="modal"
                  data-bs-target="#newProdModal"
                >
                  New
                </button>
              </div>

              <div class="d-flex flex-column flex-lg-row gap-2">
                <input
                  type="text"
                  name="searchId"
                  id="idSearchTb"
                  placeholder="Product ID"
                />

                <input
                  type="text"
                  name="searchName"
                  id="nameSearchTb"
                  placeholder="Product Name"
                />

                <button type="button" class="btn btn-primary">Search</button>
                <button type="button" class="btn btn-secondary">Clear</button>
              </div>
            </div>
            <div class="table-responsive mt-3">
              <table class="table table-hover align-middle border">
                <thead>
                  <tr>
                    <th>
                      <input
                        type="checkbox"
                        class="form-check-input"
                        id="checkAll"
                      />
                    </th>
                    <th class="position-sticky start-0">ID</th>
                    <th class="cursor-pointer" data-sort-column="name">
                      Name
                      <span class="sort-icon" title="sort">&#8593;&#8595;</span>
                    </th>
                    <th class="cursor-pointer" data-sort-column="price">
                      Price
                      <span class="sort-icon" title="sort">&#8593;&#8595;</span>
                    </th>
                    <th>Image</th>
                    <th>Quantity</th>
                    <th>Description</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div
      class="modal fade"
      id="viewProdModal"
      tabindex="-1"
      data-bs-backdrop="static"
      aria-labelledby="viewProdModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="viewProdModalLabel">Product Details</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="row gap-3">
              <div class="col-12 col-md-4 text-center">
                <img
                  id="viewProdImg"
                  src=""
                  alt=""
                  class="img-fluid rounded"
                  style="max-height: 200px; object-fit: contain"
                />
              </div>
              <div class="col d-flex flex-column gap-2">
                <div>
                  <span class="text-muted small">ID</span>
                  <p id="viewProdId" class="mb-0 fw-semibold"></p>
                </div>
                <div>
                  <span class="text-muted small">Name</span>
                  <p id="viewProdName" class="mb-0 fw-semibold"></p>
                </div>
                <div>
                  <span class="text-muted small">Price</span>
                  <p id="viewProdPrice" class="mb-0 fw-semibold"></p>
                </div>
                <div>
                  <span class="text-muted small">Quantity</span>
                  <p id="viewProdQuantity" class="mb-0 fw-semibold"></p>
                </div>
                <div>
                  <span class="text-muted small">Description</span>
                  <p id="viewProdDesc" class="mb-0 fw-semibold"></p>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="newProdModal"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-labelledby="newProdModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="newProdModalLabel">Add New Product</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="row row-cols-2">
                <div class="d-flex flex-column gap-2">
                  <div>
                    <label for="prodName" class="form-label">
                      Name
                      <span class="text-danger">*</span>
                    </label>
                    <input
                      type="text"
                      name="name"
                      id="prodName"
                      class="form-control"
                      required
                    />
                    <span id="nmeError" class="text-danger"></span>
                  </div>
                  <div>
                    <label for="prodPrice" class="form-label">
                      Price
                      <span class="text-danger">*</span>
                    </label>
                    <input
                      type="number"
                      name="price"
                      id="prodPrice"
                      class="form-control"
                      min="1"
                      required
                    />
                    <span id="priceError" class="text-danger"></span>
                  </div>
                  <div>
                    <label for="prodImg" class="form-label">
                      Image
                      <span class="text-danger">*</span>
                    </label>
                    <input
                      type="file"
                      name="image"
                      id="prodImg"
                      class="form-control"
                      accept="image/jpeg,image/png,image/webp,image/gif"
                      required
                    />
                    <span id="imgError" class="text-danger"></span>
                  </div>
                </div>
                <div class="d-flex flex-column gap-2">
                  <div>
                    <label for="prodQuantity" class="form-label">
                      Quantity <span class="text-danger">*</span>
                    </label>
                    <input
                      type="number"
                      name="quantity"
                      id="prodQuantity"
                      class="form-control"
                      min="1"
                      required
                    />
                    <span id="qtyError" class="text-danger"></span>
                  </div>
                  <div class="mt-2">
                    <label for="prodDesc" class="form-label">
                      Description <span class="text-danger">*</span>
                    </label>
                    <textarea
                      type="textarea"
                      name="desc"
                      id="prodDesc"
                      class="form-control"
                      required
                      rows="4"
                    >
                    </textarea>
                    <span id="descError" class="text-danger"></span>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-primary">Create</button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="delProdModal"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-labelledby="delProdModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="delProdModalLabel">Delete Entries</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            Are you sure you want to delete
            <span id="delCheckItems"></span> entries?
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-danger">Confirm</button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="imgPreviewModal"
      tabindex="-1"
      data-bs-backdrop="static"
    >
      <div class="modal-dialog modal-dialog-centered modal-md">
        <div class="modal-content bg-transparent border-0">
          <div class="text-end mb-2">
            <button
              type="button"
              data-bs-dismiss="modal"
              data-bs-target="#imgPreviewModal"
              class="btn btn-primary border bi bi-x-lg"
              title="close"
            ></button>
          </div>
          <div class="modal-body text-center p-0">
            <img
              id="imgPreviewEl"
              src=""
              alt="preview"
              class="img-fluid rounded"
            />
          </div>
        </div>
      </div>
    </div>

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script defer src="./assets/js/products.js"></script>
    <script defer src="./assets/js/index.js"></script>
  </body>
</html>
